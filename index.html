const SORTS = {hot:(a,b)=>((a.native===false)-(b.native===false))||score(b)-score(a), stars:(a,b)=>(+b.stars||0)-(+a.stars||0), likes:(a,b)=>(+b.likes||0)-(+a.likes||0), views:(a,b)=>(+b.views||0)-(+a.views||0), date:(a,b)=>(b.date||"").localeCompare(a.date||"")};
const score = d => (+d.likes||0) + (+d.stars||0)*3 + (+d.views||0)/400;
const fmt = n => { n = n===""||n==null?null:+n; return n==null||isNaN(n)?"":n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+"K":String(n); };
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const D = window.JEV_DATA;
const GH_SET = new Set(D.filter(d=>d.kind==="github").map(d=>(d.url||"").replace(/\/$/,"").toLowerCase()));
const dedupe = d => !(d.kind!=="github" && d.kind!=="x" && GH_SET.has(((d.github||d.url)||"").replace(/\/$/,"").toLowerCase()));
const ALL = D.filter(dedupe);
let ui = (location.hash.match(/lang=(zh|en)/)||[])[1] || localStorage.getItem("jev_ui") || (navigator.language.startsWith("zh")?"zh":"en");
let cat = (location.hash.match(/cat=([a-z-]+)/)||[])[1] || "all", kind = (location.hash.match(/kind=([a-z]+)/)||[])[1] || "x", sort="hot", lang="", q="";
if(!["zh","en"].includes(ui)) ui="zh";
if(!CATS.includes(cat)) cat="all";
if(!Object.hasOwn(KINDS,kind)) kind="x";
const T = () => I18N[ui];
const setHash = () => history.replaceState(null,"","#lang="+ui+"&cat="+cat+"&kind="+kind);

function sidebar(){
  const t=T(); const counts={}; ALL.forEach(d=>counts[d.category]=(counts[d.category]||0)+1);
  document.getElementById("side").innerHTML =
    '<button class="sitem'+(cat==="all"?" on":"")+'" data-cat="all">'+ICONS.all+'<span>'+t.allBuilds+'</span><small>'+ALL.length+'</small></button>'+
    '<h6>'+t.usecases+'</h6>'+CATS.map(c=>'<button class="sitem'+(cat===c?" on":"")+'" data-cat="'+c+'">'+ICONS[c]+'<span>'+t.cat[c]+'</span><small>'+(counts[c]||0)+'</small></button>').join("");
}
function header(){
  const t=T(); document.documentElement.lang = ui==="en"?"en":"zh-CN"; document.title=t.docTitle;
  document.getElementById("brandName").textContent=t.brand; document.getElementById("cta").textContent=t.cta; document.getElementById("q").placeholder=t.q;
  document.getElementById("q").setAttribute("aria-label",t.q);
  document.getElementById("menu").textContent=ui==="zh"?"分类":"Menu";
  const views=ALL.filter(d=>d.kind==="x").reduce((s,d)=>s+(+d.views||0),0);
  document.querySelectorAll("#uilang button").forEach(b=>b.classList.toggle("on",b.dataset.l===ui));
  document.getElementById("foot").textContent=t.foot(window.JEV_META.generated);
  const officialViews=ALL.filter(d=>d.kind==="x"&&d.official).reduce((s,d)=>s+(+d.views||0),0);
  const X=ALL.filter(d=>d.kind==="x"), GH=ALL.filter(d=>d.kind==="github");
  const values=[ALL.length,GH.length,X.length,fmt(GH.reduce((s,d)=>s+(+d.stars||0),0)),fmt(officialViews),fmt(views-officialViews),fmt(views),window.JEV_META.generated];
  const labels=ui==="zh"?["条目（去重）","开源项目","推文","开源项目累计 Star","官方发布贴浏览（"+X.filter(d=>d.official).length+" 条）","社区案例推文浏览","推文浏览合计","数据更新"]:["Unique entries","Open-source projects","X posts","GitHub stars in total","Official post views ("+X.filter(d=>d.official).length+")","Community post views","Total post views","Snapshot"];
  document.getElementById("stats").innerHTML=values.map((v,i)=>'<div><b>'+esc(v)+'</b><span>'+labels[i]+'</span></div>').join("");
  document.getElementById("foot").textContent+=(ui==="zh"?" 浏览量口径：官方发布贴 "+fmt(officialViews)+"；社区案例 "+fmt(views-officialViews)+"；合计 "+fmt(views)+"。仅累计已有浏览数的 X 帖子，不含 GitHub 条目。":" Views: official launch posts "+fmt(officialViews)+"; community cases "+fmt(views-officialViews)+"; total "+fmt(views)+". Only X posts with recorded view counts; GitHub entries excluded.");
}
function render(){
  const t=T(); sidebar();
  document.querySelector(".main").classList.toggle("overview",cat==="all");
  const inCat = ALL.filter(d=>cat==="all"||d.category===cat).filter(d=>!lang||d.srcLang===lang);
  const kc={}; Object.keys(KINDS).forEach(k=>kc[k]=inCat.filter(KINDS[k]).length);
  if(!kc[kind]&&inCat.length) kind="all";
  setHash();
  document.getElementById("crumb").innerHTML = cat==="all" ? '<b>'+t.allBuilds+'</b>' : t.allBuilds+' / <b>'+t.cat[cat]+'</b>';
  document.getElementById("hero").innerHTML = '<div class="ic">'+(ICONS[cat]||ICONS.all)+'</div><div><h1>'+(cat==="all"?t.brand:t.cat[cat])+'</h1><p>'+t.catDesc[cat]+'</p><div class="n">'+t.n(inCat.length)+'</div></div>';
  document.getElementById("filters").innerHTML = Object.keys(KINDS).filter(k=>k==="all"||kc[k]).map(k=>'<button class="pill'+(kind===k?" on":"")+'" data-kind="'+k+'">'+t.kinds[k]+'<small>'+kc[k]+'</small></button>').join("")+
    '<span class="sp"></span><select id="lang">'+Object.entries(t.langs).map(([k,v])=>'<option value="'+k+'"'+(k===lang?" selected":"")+'>'+v+'</option>').join("")+'</select><select id="sort">'+Object.keys(SORTS).map(k=>'<option value="'+k+'"'+(k===sort?" selected":"")+'>'+t.sorts[k]+'</option>').join("")+'</select>';
  document.getElementById("lang").setAttribute("aria-label",ui==="zh"?"内容语言":"Content language");
  document.getElementById("sort").setAttribute("aria-label",ui==="zh"?"排序":"Sort");
  const kw=q.trim().toLowerCase();
  let rows = inCat.filter(KINDS[kind]||KINDS.all).filter(d=>!kw||(d.title+" "+(d.zh||"")+" "+(d.summary||"")+" "+(d.post||"")+" "+(d.author||"")+" "+(d.handle||"")+" "+(d.tags||[]).join(" ")+" "+(d.github||"")).toLowerCase().includes(kw));
  rows.sort(SORTS[sort]);
  document.getElementById("grid").innerHTML = rows.length ? rows.map(cat==="all"?overviewCard:card).join("") : '<div class="empty">'+t.empty+'</div>';
}
function overviewCard(d,i){
  const t=T(), desc=ui==="en"?(d.summary||(d.srcLang==="zh"?d.zh:"")):(d.zh||d.summary||"");
  const text=d.kind==="x"?d.post:(ui==="zh"?d.summary:"");
  const links=[[d.url,ui==="zh"?"打开来源":"Open source"]];
  if(d.github&&d.github!==d.url) links.push([d.github,"GitHub"]);
  if(d.x&&d.x!==d.url) links.push([d.x,"X"]);
  return '<article class="card"><div class="top"><span class="rank">#'+(i+1)+'</span><span class="category">'+esc(t.cat[d.category])+'</span><span>'+esc(t.kind[d.kind])+(d.official?' · '+t.official:"")+(d.native===false?' · '+t.integ:"")+'</span></div>'+
    '<h3 class="ttl"><a href="'+esc(d.url)+'" target="_blank" rel="noopener">'+esc(d.title)+'</a></h3>'+
    (desc?'<p class="summary">'+esc(desc)+'</p>':"")+(text?'<p class="post">'+esc(text)+'</p>':"")+
    (d.media?'<a href="'+esc(d.url)+'" target="_blank" rel="noopener"><img class="media" loading="lazy" referrerpolicy="no-referrer" src="'+esc(d.media)+'" alt="'+esc(d.title)+'"></a>':"")+
    (d.author?'<div class="author">'+esc(d.author)+(d.handle?' · @'+esc(d.handle):"")+'</div>':"")+
    (d.tags?.length?'<div class="tags">'+d.tags.slice(0,6).map(tag=>'<span>'+esc(tag)+'</span>').join("")+'</div>':"")+
    '<div class="foot">'+metrics(d)+'</div><div class="links">'+links.map(([url,label])=>'<a href="'+esc(url)+'" target="_blank" rel="noopener">'+label+' ↗</a>').join("")+'</div></article>';
}
function metrics(d){
  const m=[]; if(d.metrics) Object.entries(d.metrics).slice(0,4).forEach(([k,v])=>m.push(esc(k)+' <b>'+esc(v)+'</b>'));
  if(d.stars!=null) m.push('★ <b>'+fmt(d.stars)+'</b>'); if(d.likes!=null) m.push('♥ <b>'+fmt(d.likes)+'</b>'); if(d.views!=null) m.push((ui==="zh"?'浏览':'Views')+' <b>'+fmt(d.views)+'</b>');
  if(d.lang) m.push(esc(d.lang)); if(d.date) m.push(esc(d.date));
  return m.length?'<div class="m">'+m.map(value=>'<span>'+value+'</span>').join("")+'</div>':"";
}
function foot(d, title){
  const t=T(); const k = d.kind==="x" ? ICONS.x+' '+t.kind.x : d.kind==="github" ? ICONS.doc+' GitHub' : ICONS.doc+' '+(t.kind[d.kind]||d.kind);
  const pick = d.official ? '<span class="pk">★ '+t.official+'</span>' : (d.native===false ? '<span class="pk" style="color:var(--muted)">'+t.integ+'</span>' : "");
  return '<div class="foot"><div class="k">'+k+' · '+esc(t.cat[d.category]||d.category)+pick+'</div><div class="t"><a href="'+esc(d.url)+'" target="_blank" rel="noopener">'+esc(title)+'</a></div>'+metrics(d)+'</div>';
}
function card(d){
  const en = ui==="en"; const desc = en ? (d.summary||(d.srcLang==="zh"?d.zh:"")) : (d.zh||d.summary||"");
  const media = d.media ? '<a href="'+esc(d.url)+'" target="_blank" rel="noopener"><img class="media" loading="lazy" referrerpolicy="no-referrer" src="'+esc(d.media)+'" alt=""></a>' : "";
  if(d.kind==="x"){
    const av = d.avatar ? '<img class="av" loading="lazy" referrerpolicy="no-referrer" src="'+esc(d.avatar)+'" alt="">' : '<span class="av">'+esc((d.author||d.handle||"?").slice(0,1).toUpperCase())+'</span>';
    const ghl = d.github ? '<a class="xk" title="GitHub" href="'+esc(d.github)+'" target="_blank" rel="noopener" style="margin-left:0">'+ICONS.gh.replace('<svg','<svg width="16" height="16"')+'</a>' : "";
    return '<article class="card"><div class="who">'+av+'<div><div class="nm">'+esc(d.author||d.handle||"")+'</div>'+(d.handle?'<div class="hd">@'+esc(d.handle)+'</div>':"")+'</div><a class="xk" href="'+esc(d.url)+'" target="_blank" rel="noopener" title="X">'+ICONS.x+'</a>'+ghl+'</div>'+
      (d.post?'<p class="post">'+esc(d.post)+'</p>':(desc?'<p class="post">'+esc(desc)+'</p>':""))+media+foot(d, en?(d.title):(d.zh||d.title))+'</article>';
  }
  if(d.kind==="github"){
    const [owner, repo] = (d.title||"").split("/");
    return '<article class="card"><div class="gh"><div class="ic">'+ICONS.gh+'</div><div><div class="nm"><a href="'+esc(d.url)+'" target="_blank" rel="noopener">'+esc(repo||d.title)+'</a></div><div class="hd">'+esc(owner||"")+(d.lang?' · '+esc(d.lang):"")+'</div></div>'+(d.x?'<a class="xk" href="'+esc(d.x)+'" target="_blank" rel="noopener" title="X" style="margin-left:auto">'+ICONS.x+'</a>':"")+'</div>'+
      (desc?'<p class="desc" style="-webkit-line-clamp:5">'+esc(desc)+'</p>':"")+media+(d.tags&&d.tags.length?'<div class="tags">'+d.tags.slice(0,5).map(x=>'<span>'+esc(x)+'</span>').join("")+'</div>':"")+foot(d, d.title)+'</article>';
  }
  // article / skill / site / official
  const stat = d.metrics && Object.keys(d.metrics).length ? Object.entries(d.metrics)[0] : null;
  return '<article class="card"><div class="k mono" style="font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center">'+ICONS.doc+' '+esc(T().kind[d.kind]||d.kind)+' · '+esc(T().cat[d.category]||d.category)+'</div>'+
    (stat?'<div class="big">'+esc(stat[1])+'</div><div class="cap">'+esc(stat[0])+'</div>':"")+
    '<div class="foot" style="background:none;padding:12px 2px 0"><div class="t"><a href="'+esc(d.url)+'" target="_blank" rel="noopener">'+esc(d.title)+'</a></div>'+(desc?'<p class="desc" style="margin-top:6px">'+esc(desc)+'</p>':"")+(d.author?'<div class="hd mono" style="margin-top:10px;color:var(--muted);font-size:12.5px">'+esc(d.author)+'</div>':"")+'</div>'+media+'</article>';
}
function closeMenu(){document.getElementById("side").classList.remove("open");document.getElementById("menu").setAttribute("aria-expanded","false");}
document.getElementById("menu").onclick=()=>{const open=document.getElementById("side").classList.toggle("open");document.getElementById("menu").setAttribute("aria-expanded",String(open));};
document.getElementById("side").onclick = e=>{const b=e.target.closest("[data-cat]"); if(!b)return; cat=b.dataset.cat; closeMenu(); render(); window.scrollTo({top:0});};
document.querySelector(".brand").onclick=e=>{e.preventDefault();cat="all";kind="x";sort="hot";q="";lang="";document.getElementById("q").value="";closeMenu();render();window.scrollTo({top:0});};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeMenu();document.getElementById("menu").focus();}});
window.addEventListener("hashchange",()=>{
  const params=new URLSearchParams(location.hash.slice(1));
  ui=["zh","en"].includes(params.get("lang"))?params.get("lang"):ui;
  cat=CATS.includes(params.get("cat"))?params.get("cat"):"all";
  kind=Object.hasOwn(KINDS,params.get("kind"))?params.get("kind"):"x";
  closeMenu();header();render();
});
document.getElementById("filters").onclick = e=>{const b=e.target.closest("[data-kind]"); if(!b)return; kind=b.dataset.kind; render();};
document.getElementById("filters").onchange = e=>{ if(e.target.id==="sort") sort=e.target.value; if(e.target.id==="lang") lang=e.target.value; render(); };
document.getElementById("q").oninput = e=>{q=e.target.value; render();};
document.getElementById("uilang").onclick = e=>{const b=e.target.closest("button"); if(!b)return; ui=b.dataset.l; localStorage.setItem("jev_ui",ui); header(); render();};
document.addEventListener("keydown", e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); document.getElementById("q").focus(); } });
header(); render();
</script>
</body>
</html>
